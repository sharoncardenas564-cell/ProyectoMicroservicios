```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Microservicios</title>
</head>

<body>

    <h1>Calculadora</h1>

    <label>Dato 1:</label>
    <input type="number" id="dato1">

    <br><br>

    <label>Dato 2:</label>
    <input type="number" id="dato2">

    <br><br>

    <label>Resultado:</label>
    <input type="text" id="resultado" readonly>

    <br><br>

    <button id="btnBody">Body Params</button>
    <button id="btnQuery">Query Params</button>
    <button id="btnPath">Path Params</button>

    <script>

        const dato1 = document.getElementById("dato1");
        const dato2 = document.getElementById("dato2");
        const resultado = document.getElementById("resultado");

        // BODY PARAMS
        document.getElementById("btnBody").addEventListener("click", async () => {

            const datos = {
                dato1: Number(dato1.value),
                dato2: Number(dato2.value)
            };

            const respuesta = await fetch(
                "https://suma-limpieza-body.onrender.com/body",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(datos)
                }
            );

            const datosRespuesta = await respuesta.json();

            resultado.value = datosRespuesta.resultado;
        });


        // QUERY PARAMS
        document.getElementById("btnQuery").addEventListener("click", async () => {

            const numero1 = Number(dato1.value);
            const numero2 = Number(dato2.value);

            const respuesta = await fetch(
                `https://suma-limpieza-query.onrender.com/query?dato1=${numero1}&dato2=${numero2}`
            );

            const datosRespuesta = await respuesta.json();

            resultado.value = datosRespuesta.resultado;
        });


        // PATH PARAMS
        document.getElementById("btnPath").addEventListener("click", async () => {

            const numero1 = Number(dato1.value);
            const numero2 = Number(dato2.value);

            const respuesta = await fetch(
                `https://suma-limpieza-path.onrender.com/path/${numero1}/${numero2}`
            );

            const datosRespuesta = await respuesta.json();

            resultado.value = datosRespuesta.resultado;
        });

    </script>

</body>
</html>
```
